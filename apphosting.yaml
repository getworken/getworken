# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting

# Runtime configuration
# Optimized for pre-launch waitlist mode (low traffic, static content)
runConfig:
  # CPU allocation: 1 vCPU is sufficient for static Next.js pages
  # Scale up to 2-4 when adding Server Actions post-launch
  cpu: 1

  # Memory: 512MB handles Next.js SSR/SSG efficiently
  # Pre-launch traffic is minimal, no need for higher memory
  memoryMiB: 512

  # Concurrency: 80 requests per instance (Cloud Run default)
  # Each instance can handle 80 concurrent requests before spawning new instances
  concurrency: 80

  # Max instances: Cap at 5 to control costs during pre-launch
  # Scale to 20-50+ post-launch based on traffic patterns
  maxInstances: 5

  # Min instances: 0 for cost optimization (cold starts acceptable pre-launch)
  # Set to 1-2 post-launch to eliminate cold starts for better UX
  minInstances: 0

# Environment variables (non-secret)
# For secrets, use Firebase Console → App Hosting → Secrets
env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_LAUNCH_MODE
    value: 'false'
    availability:
      - BUILD
      - RUNTIME

